<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | Go Adventures</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind-config.js"></script>
</head>
<body class="bg-fondo-oscuro text-white font-sans antialiased overflow-x-hidden">

    <!-- BARRA DE NAVEGACIÓN (Los enlaces regresan a index.html) -->
    <header class="fixed top-0 w-full z-40 bg-fondo-oscuro/80 backdrop-blur-md border-b border-gray-800 transition-all flex items-center justify-between px-6 py-4 md:px-12">
        <div class="flex flex-col">
            <span class="text-2xl font-bold tracking-wider">Go Adventours</span>
            <span class="text-[0.65rem] text-gray-300 tracking-[0.25em] uppercase">Vive • Explora • Descubre</span>
        </div>
        <nav class="hidden md:flex space-x-8 text-sm font-medium">
            <a href="index.html" class="text-gray-300 hover:text-white transition-colors">Inicio</a>
            <a href="index.html#tours" class="text-gray-300 hover:text-white transition-colors">Tours</a>
            <a href="index.html#nosotros" class="text-gray-300 hover:text-white transition-colors">Nosotros</a>
            <a href="#" class="text-white border-b-2 border-verde-natura pb-1">Galería</a>
        </nav>
        <button class="btn-abrir-modal border border-verde-natura text-verde-natura hover:bg-verde-natura hover:text-white transition-all px-6 py-2 rounded-full text-sm font-semibold">
            Reserva tu aventura
        </button>
    </header>

    <!-- SECCIÓN DE GALERÍA CON CARRUSEL E INSTAGRAM -->
    <section class="pt-32 pb-24 min-h-screen flex flex-col justify-center bg-black relative">
        <div class="max-w-7xl mx-auto px-6 md:px-12 lg:px-20 w-full">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-10 gap-4">
                <div>
                    <h2 class="text-4xl font-bold text-white mb-2">Nuestra <span class="text-naranja-aventura">Galería</span></h2>
                    <p class="text-gray-400">Las mejores vistas capturadas por nuestros aventureros.</p>
                </div>
                <!-- ENLACE OFICIAL A INSTAGRAM -->
                <a href="https://www.instagram.com/goadventuresnic?stkn=MXB1Z3Ewc3J3c2VtMQ==" target="_blank" class="inline-flex items-center gap-2 text-sm text-gray-400 hover:text-white transition-colors border border-gray-700 px-4 py-2 rounded-full hover:border-white">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                    Síguenos en Instagram
                </a>
            </div>
            
            <!-- Carrusel -->
            <div class="relative group rounded-3xl overflow-hidden shadow-2xl border border-gray-800">
                <div id="carrusel-slides" class="flex transition-transform duration-700 ease-in-out h-[60vh] md:h-[75vh]">
                    <div class="w-full flex-shrink-0 relative"><img src="https://images.unsplash.com/photo-1643213506161-12c8ff44a1b0?q=80&w=1200" class="w-full h-full object-cover" alt="Cerro Negro"><div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent flex items-end justify-center pb-12"><h3 class="text-2xl font-bold text-white tracking-widest uppercase">Cerro Negro</h3></div></div>
                    <div class="w-full flex-shrink-0 relative"><img src="https://images.unsplash.com/photo-1518105779142-d975f22f1b0a?q=80&w=1200" class="w-full h-full object-cover" alt="León Walking"><div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent flex items-end justify-center pb-12"><h3 class="text-2xl font-bold text-white tracking-widest uppercase">Cultura y Tradición</h3></div></div>
                    <div class="w-full flex-shrink-0 relative"><img src="https://images.unsplash.com/photo-1476611317561-60117649dd94?q=80&w=1200" class="w-full h-full object-cover" alt="Juan Venado"><div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent flex items-end justify-center pb-12"><h3 class="text-2xl font-bold text-white tracking-widest uppercase">Reserva Juan Venado</h3></div></div>
                    <div class="w-full flex-shrink-0 relative"><img src="https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?q=80&w=1200" class="w-full h-full object-cover" alt="Atardecer Telica"><div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent flex items-end justify-center pb-12"><h3 class="text-2xl font-bold text-white tracking-widest uppercase">Atardeceres Únicos</h3></div></div>
                </div>
                <button id="btn-prev" class="absolute top-1/2 -translate-y-1/2 left-4 w-12 h-12 bg-black/50 text-white rounded-full flex items-center justify-center hover:bg-verde-natura transition-colors backdrop-blur z-10"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
                <button id="btn-next" class="absolute top-1/2 -translate-y-1/2 right-4 w-12 h-12 bg-black/50 text-white rounded-full flex items-center justify-center hover:bg-verde-natura transition-colors backdrop-blur z-10"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
                <div class="absolute bottom-6 left-0 right-0 flex justify-center gap-3" id="carrusel-dots">
                    <button class="w-3 h-3 rounded-full bg-verde-natura transition-colors dot-indicador" data-index="0"></button>
                    <button class="w-3 h-3 rounded-full bg-white/40 hover:bg-white transition-colors dot-indicador" data-index="1"></button>
                    <button class="w-3 h-3 rounded-full bg-white/40 hover:bg-white transition-colors dot-indicador" data-index="2"></button>
                    <button class="w-3 h-3 rounded-full bg-white/40 hover:bg-white transition-colors dot-indicador" data-index="3"></button>
                </div>
            </div>
        </div>
    </section>

    <!-- Vinculamos la misma lógica para que funcione el menú de hamburguesa y demás -->
    <script src="script.js"></script>
</body>
</html>
